name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Instalar dependências e compilar Web App
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 5. Gerar projeto Android via Capacitor e Sincronizar
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 6. Compilar APK Debug com Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 7. Enviar APK pronto para aba Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sereno-Autismo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
